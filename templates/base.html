<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Performance Predictor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">S</span>
                Student Performance Predictor
            </a>
            <nav class="nav">
                <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
                <a href="{{ url_for('predict_datapoint') }}" class="{% if request.endpoint == 'predict_datapoint' %}active{% endif %}">Predict</a>
                <a href="https://github.com/shivansh1907/student-performance-predictor" target="_blank" rel="noopener">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>Built with scikit-learn &amp; Flask · Deployed on AWS Elastic Beanstalk</span>
            <span>© Shivansh Khandelwal</span>
        </div>
    </footer>
</body>
</html>
